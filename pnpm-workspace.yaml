# Supply-chain: ignore versions younger than 24h (blocks just-published malicious releases)
minimumReleaseAge: 1440

# Supply-chain: fail installs where a release's trust evidence (provenance,
# trusted publisher) drops below an earlier-published release of the same
# package — a takeover signal. The 30d window exempts pre-signing-era
# releases that would otherwise false-positive.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
onlyBuiltDependencies:
  - "esbuild"
  - "lightningcss"
overrides:
  "js-yaml": ">=4.3.2"
  # F822: seroval 1.5.6 sits below both patch floors under
  # start-server-core 1.169.17 — >=1.6.2 (GHSA-p6vx-979v, thenable
  # assimilation) and >=1.6.3 (GHSA-jp82-f5mq-hwhp, TypedArray exhaustion).
  # The installed server-functions-handler runs fromJSON on the GET
  # ?payload= before any handler, so the deserializer is live attack
  # surface. pnpm 10+ reads overrides from this file, not package.json.
  "seroval": ">=1.6.3"
  # F952: the same floor applies to seroval-plugins, which still resolved
  # 1.5.6 under start-server-core.
  "seroval-plugins": ">=1.6.3"
  # F952: sharp <=0.35.4 ships a vulnerable libheif/librsvg — GHSA-rgj7-g3m4-5g8c
  # (>=0.35.4) and GHSA-wq5f-xc86-pv6w (>=0.35.5). Reached in the production
  # graph through @cloudflare/vite-plugin > miniflare > sharp.
  "sharp": ">=0.35.5"
  # F952: undici <7.29.1 carries fifteen advisories (GHSA-4cwx-7wf7-3272,
  # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-r53p-7pc4-xj5r,
  # GHSA-2gqq-gqf2-x968, GHSA-8436-99hf-9mmv and others). Held on 7.x:
  # undici 8 drops lib/handler/wrap-handler.js that jsdom deep-requires.
  "undici": "^7.29.1"
